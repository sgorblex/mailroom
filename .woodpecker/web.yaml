# `ci:pause` pauses this pipeline too - see backend.yaml.
when:
  - event: push
    branch: main
  - event: pull_request
    evaluate: 'not ("ci:pause" in split(CI_COMMIT_PULL_REQUEST_LABELS, ","))'

steps:
  - name: check
    image: node:26-slim@sha256:193fe51b64e77981119c98c2002c9e32a70e2f006fb4d25068ce0558998917f0
    # /cache is mounted into every step by the agents (WOODPECKER_BACKEND_DOCKER_VOLUMES), so the
    # repo needs no trust for it. A tscache miss costs a cold `tsc -b`, never a wrong result.
    environment:
      npm_config_store_dir: /cache/pnpm-store
    when:
      - event: push
        branch: main
        path:
          include: &web-paths ['web/**', 'mise.toml', '.woodpecker/web.yaml']
      - event: pull_request
        evaluate: 'not (CI_COMMIT_SOURCE_BRANCH startsWith "release-please--")'
        path:
          include: *web-paths
    commands:
      - npm install -g pnpm@12.10.1
      - mkdir -p /cache/mailroom-web-tscache && ln -sfn /cache/mailroom-web-tscache web/.tscache
      - cd web
      - pnpm install --frozen-lockfile
      - pnpm run lint
      - pnpm run i18n:check
      - VITE_GIT_SHA="$CI_COMMIT_SHA" VITE_GIT_BRANCH="$CI_COMMIT_BRANCH" pnpm run build
