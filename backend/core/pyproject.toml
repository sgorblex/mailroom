[project]
name = "mailroom-core"
version = "0.0.0"
description = "Mailroom's mail layer: accounts, sealed secrets, IMAP/SMTP, the send gate, rendering, audit"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling>=1.26.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailroom_core"]
