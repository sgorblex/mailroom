# The test Dovecot's overrides (scripts/test-mail.sh; copied from mailroom-mcp's
# test/dovecot/99-test.conf). Production is Mailu's Dovecot 2.3: no IMAP4rev2, and these four
# special-use folders exist from the start.
imap4rev2_enable = no
namespace inbox {
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}
# Each connection keeps a login process of its own (restart_request_count = 1) for its
# lifetime: the default 100 is fewer than the parallel test workers' pooled connections.
service imap-login {
  process_limit = 500
}
# A quota on every user, so that the server offers QUOTA.
mail_plugins {
  quota = yes
}
protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}
quota "User quota" {
  storage_size = 1G
  message_count = 100000
}
