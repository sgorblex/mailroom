[project]
name = "mailroom-core"
version = "0.0.0"
description = "Mailroom's mail layer: accounts, sealed secrets, IMAP/SMTP, the send gate, rendering, audit"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.20.0",
  "cryptography>=50.0.2",
  "psycopg[binary]>=3.3.6",
  "pydantic>=2.14.1",
  "sqlalchemy>=2.1.5",
  "tzdata>=2026.5",
]

[project.optional-dependencies]
# mailroom_core.testing, for the packages and the app that test against it.
testing = ["pytest>=8.3"]

# Loads mailroom_core.testing into every pytest run where mailroom-core is installed.
[project.entry-points.pytest11]
mailroom_core = "mailroom_core.testing.plugin"

[build-system]
requires = ["hatchling>=1.26.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailroom_core"]
