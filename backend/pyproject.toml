[project]
name = "mailroom"
version = "0.4.0"
description = "Mailroom backend: mail client, filters and MCP server (API and domain logic)"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
dependencies = [
  "alembic>=1.15",
  "argon2-cffi>=25.1",
  "fastapi>=0.115",
  # `mise run deps-local` swaps imap-thingy and mailroom-core for local editable checkouts
  # (scripts/deps.sh).
  "imap-thingy>=0.8.0",
  "imapclient>=3.1.0",
  "jsonschema>=4.23",
  "mailroom-core>=0.1.3",
  # The worker's job queue. Bounded to one minor: see nonfunctional-requirements.md (procrastinate).
  "procrastinate>=3.10,<3.11",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  # Starlette's parser for the one multipart route, POST /api/v1/mail/drafts.
  "python-multipart>=0.0.20",
  # The engine imap-thingy matches user patterns with (it can time a match out): the API checks
  # them with it too.
  "regex>=2024.11.6",
  "sqlalchemy>=2.0",
  "uvicorn>=0.34",
  # The two extras `uvicorn[standard]` would pull in for their own sake. `uvloop` keeps the marker
  # the extra carries: it has no Windows wheel and does not build there.
  "uvloop>=0.21; platform_python_implementation != 'PyPy' and sys_platform != 'cygwin' and sys_platform != 'win32'",
  "httptools>=0.6",
  # The MCP server (mailroom.mcp) and the built-in OAuth authorization server (mailroom.oauth).
  # Bounded to one minor: the app uses the SDK's low-level server, session manager, auth middleware
  # and authorize, token, register and revoke handlers directly (nonfunctional-requirements.md).
  "mcp>=1.30,<1.31",
  # OIDC and OAuth: discovery, JWKS and client metadata documents (httpx); ID tokens and an
  # external issuer's JWTs checked against them (pyjwt). mcp brings both too.
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
  # mailroom_core.testing's dependencies; its pytest plugin (no-network guard, store fixtures)
  # loads from the base package.
  "mailroom-core[testing]",
  # Bounded to one minor for the same reason as `ruff` below.
  "mypy>=2.4,<2.5",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.8.0",
  # Bounded to one minor: an open floor lets `lockFileMaintenance` pull new lint rules into a
  # green branch with no dependency PR. Widen deliberately, fixing the new diagnostics.
  "ruff>=0.17,<0.18",
  "types-jsonschema>=4.23",
  "types-regex>=2024.11.6",
  # `mailroom.dev.run_uvicorn` reloads on change; the runtime image never watches files.
  "watchfiles>=1.0",
]

[build-system]
requires = ["hatchling>=1.26.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mailroom"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["mailroom", "alembic", "tests"]

[tool.ruff.lint]
select = [
  "A", "ANN", "B", "C4", "DTZ", "E", "EXE", "F", "FA", "I", "ICN", "ISC", "LOG", "N",
  "PIE", "PLE", "PLW", "PT", "PYI", "Q", "RET", "RSE", "RUF", "SIM", "SLF", "SLOT", "TCH",
  "TID", "UP", "W", "YTT",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
suppress-none-returning = false

[tool.ruff.lint.isort]
known-first-party = ["mailroom"]
# The MCP SDK, not `mailroom/mcp` (which `src` would make it look like).
known-third-party = ["mcp"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection uses `Depends(...)` in parameter defaults by design, and resolves
# route annotations at runtime, so their imports cannot move under TYPE_CHECKING.
"tests/**/*.py" = ["ANN", "E501", "S101"]
"mailroom/api/routes/**/*.py" = ["B008", "TC001", "TC002", "TC003"]

[tool.ruff.lint.flake8-type-checking]
# SQLAlchemy and Pydantic read these classes' annotations at runtime.
runtime-evaluated-base-classes = ["mailroom.models.base.Base", "pydantic.BaseModel"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["mailroom"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_concatenate = true
extra_checks = true
show_error_codes = true
pretty = true
error_summary = false

# Untyped.
[[tool.mypy.overrides]]
module = ["imapclient", "imapclient.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: PostgreSQL required (TEST_DATABASE_URL: local `compose.yml` postgres service via `mise run dev-db`, or the CI database step); loopback URL ends with _test unless MAILROOM_INTEGRATION_TESTS_ALLOW_ANY_DATABASE=1; mise run test-backend uses pytest-xdist (-n auto)",
]
