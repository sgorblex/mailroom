# The image's `main` format with the path in place of the request line: a query string can hold
# mail data (a folder name, a search the SPA keeps in its URL), so it is never logged.
log_format mailroom '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    listen [::]:8080;
    access_log /var/log/nginx/access.log mailroom;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mailroom is private. Every `add_header` here is inherited by a location block only while
    # that block adds no header of its own, so the locations below repeat the set.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Only the host's reverse proxy reaches this port (the pod publishes it on loopback), so the
    # client is the last address it appended to X-Forwarded-For. The API keys login throttling on it.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Forwarded-For;

    # Everything but the SPA's CSP: its `frame-ancestors 'none'` would stop the SPA framing a
    # message's HTML document, which carries its own CSP (docs/requirements/mail-client.md).
    # The mail routes set nosniff and no-referrer too; hiding theirs sends each header once.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # The MCP server and the built-in OAuth server (docs/requirements/mcp.md), proxied as /api/ is.
    # They set their own headers, so the SPA's CSP does not apply. (/connect, the consent screen,
    # is the SPA's, served by `location /`.) OpenID discovery goes too: a client probes it for the
    # OAuth server, and the API's 404 is the answer, not the SPA.
    location ~ ^/(mcp$|oauth/|\.well-known/oauth-|\.well-known/openid-configuration) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Vite content-hashes everything under /assets, so a URL never changes meaning.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
