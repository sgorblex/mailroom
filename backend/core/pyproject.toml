[project]
name = "mailroom-core"
version = "0.1.3"
description = "Mailroom's mail layer and filter engine: accounts, sealed secrets, IMAP/SMTP, the send gate, rendering, audit, filters"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
# Part of the Mailroom app's backend, never published again: 0.1.3 was its last PyPI release.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "alembic>=1.20.0",
  "cryptography>=50.0.2",
  "imapclient>=4.1.0,<4.2",
  "lxml>=6.1.3",
  "nh3>=0.3.7",
  "psycopg[binary]>=3.3.6",
  "pydantic>=2.14.1",
  # The filter engine matches user patterns with it, under a timeout.
  "regex>=2024.11.6",
  "sqlalchemy>=2.1.5",
  "tzdata>=2026.5",
]

[project.urls]
Repository = "https://github.com/sgorblex/mailroom"

[project.optional-dependencies]
# mailroom_core.testing, for core's own tests and the app's.
testing = ["pytest>=8.3"]

# Loads mailroom_core.testing into every pytest run where mailroom-core is installed.
[project.entry-points.pytest11]
mailroom_core = "mailroom_core.testing.plugin"

[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailroom_core"]

# Core's tests run on their own, from this directory (`mise run test-core`): the app's conftest
# and its `integration` marker (PostgreSQL) never apply here, and core's (the test mail servers)
# never reach the app's tests. importlib: the test files are not a package.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
