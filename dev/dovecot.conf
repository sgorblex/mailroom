# The dev environment's Dovecot overrides (copied from mailroom-mcp's dev/dovecot.conf): the
# special-use folders production has from the start, no IMAP4rev2 (production is Mailu's
# Dovecot 2.3). The dev TLS certificate is mounted where the image's conf.d/ssl.conf expects it.
imap4rev2_enable = no
namespace inbox {
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}
