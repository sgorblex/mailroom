labels:
  platform: linux/arm64

# A `v*` tag builds both images and pushes :<version>. Nothing deploys from here: Renovate proposes
# the new version in the host's config repo (oci-server-conf), and merging that PR deploys it
# (docs/requirements/ci-cd.md). A manual run builds both without pushing, to test the pipeline.
#
# No repo trust needed: the builds run in plugin-docker-buildx, which the Woodpecker server allows to
# run privileged at exactly this tag@digest (WOODPECKER_PLUGINS_PRIVILEGED); bump the image there
# first. BuildKit's cache lives in Zot as :buildcache. Both images are built (not pushed) before
# either is pushed, so a failed build pushes nothing; the push steps then hit that cache.
when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

steps:
  - name: prepare
    image: docker.io/library/alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    commands:
      - scripts/release-prepare.sh

  - name: build-api
    image: docker.io/woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    settings: &api
      registry: reg.aclerici.me
      username:
        from_secret: mailroom_app_registry_user
      password:
        from_secret: mailroom_app_registry_password
      repo: reg.aclerici.me/mailroom-api
      tags_file: .tags
      dockerfile: backend/Containerfile
      context: .
      platforms: linux/arm64
      env_file: .build.env
      build_args_from_env: [MAILROOM_GIT_SHA, MAILROOM_GIT_BRANCH, MAILROOM_VERSION, MAILROOM_BUILD_DATE]
      # A list setting, so its comma is escaped; cache_to is a plain string.
      cache_from: 'type=registry\,ref=reg.aclerici.me/mailroom-api:buildcache'
      cache_to: type=registry,ref=reg.aclerici.me/mailroom-api:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
      dry_run: true

  - name: build-web
    image: docker.io/woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    settings: &web
      registry: reg.aclerici.me
      username:
        from_secret: mailroom_app_registry_user
      password:
        from_secret: mailroom_app_registry_password
      repo: reg.aclerici.me/mailroom-web
      tags_file: .tags
      dockerfile: web/Containerfile
      context: web
      platforms: linux/arm64
      env_file: .build.env
      build_args_from_env: [VITE_GIT_SHA, VITE_GIT_BRANCH, VITE_MAILROOM_DEPLOY_ENV, VITE_VERSION, MAILROOM_BUILD_DATE]
      cache_from: 'type=registry\,ref=reg.aclerici.me/mailroom-web:buildcache'
      cache_to: type=registry,ref=reg.aclerici.me/mailroom-web:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
      dry_run: true

  - name: push-api
    image: docker.io/woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    when:
      - event: tag
    settings:
      <<: *api
      dry_run: false

  - name: push-web
    image: docker.io/woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    when:
      - event: tag
    settings:
      <<: *web
      dry_run: false
