labels:
  platform: linux/arm64

# Builds and pushes both images, then deploys them on the production host
# (docs/requirements/ci-cd.md).
when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: build-push
    image: docker.io/library/docker:29-cli@sha256:b1805116a6a86cc591b5d5f60a910a0715cdcc9d18d866ad68b1457ead25c35c
    # Needs this repository trusted for volumes on the Woodpecker server.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      MAILROOM_CONTAINER_ENGINE: docker
      MAILROOM_REGISTRY:
        from_secret: mailroom_app_registry
      MAILROOM_REGISTRY_USER:
        from_secret: mailroom_app_registry_user
      MAILROOM_REGISTRY_PASSWORD:
        from_secret: mailroom_app_registry_password
    commands:
      # docker:*-cli ships busybox ash only; the scripts are bash.
      - apk add --no-cache bash
      - echo "$MAILROOM_REGISTRY_PASSWORD" | docker login "$MAILROOM_REGISTRY" -u "$MAILROOM_REGISTRY_USER" --password-stdin
      # Builds both images before pushing any tag, so a failed build moves neither :production.
      - scripts/containers-both.sh production

  - name: deploy
    image: docker.io/library/alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    environment:
      MAILROOM_DEPLOY_HOST:
        from_secret: mailroom_app_deploy_host
      MAILROOM_DEPLOY_SSH_KEY:
        from_secret: mailroom_app_deploy_ssh_key
      MAILROOM_DEPLOY_KNOWN_HOSTS:
        from_secret: mailroom_app_deploy_known_hosts
      MAILROOM_REGISTRY:
        from_secret: mailroom_app_registry
      MAILROOM_REGISTRY_USER:
        from_secret: mailroom_app_registry_user
      MAILROOM_REGISTRY_PASSWORD:
        from_secret: mailroom_app_registry_password
    commands:
      - apk add --no-cache bash openssh-client
      - scripts/ssh-deploy.sh
