[project]
name = "mailroom"
version = "0.0.0"
description = "Mailroom backend: mail client, filters and MCP host (API and domain logic)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.15",
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "uvicorn>=0.34",
  # The two extras `uvicorn[standard]` would pull in for their own sake. `uvloop` keeps the marker
  # the extra carries: it has no Windows wheel and does not build there.
  "uvloop>=0.21; platform_python_implementation != 'PyPy' and sys_platform != 'cygwin' and sys_platform != 'win32'",
  "httptools>=0.6",
]

[dependency-groups]
dev = [
  # Starlette's TestClient imports httpx; Starlette does not declare it as a dependency.
  "httpx>=0.28",
  # Bounded to one minor for the same reason as `ruff` below.
  "mypy>=2.4,<2.5",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.8.0",
  # Bounded to one minor: an open floor lets `lockFileMaintenance` pull new lint rules into a
  # green branch with no dependency PR. Widen deliberately, fixing the new diagnostics.
  "ruff>=0.17,<0.18",
  # `mailroom.dev.run_uvicorn` reloads on change; the runtime image never watches files.
  "watchfiles>=1.0",
]

[build-system]
requires = ["hatchling>=1.26.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mailroom"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["mailroom", "alembic", "tests"]

[tool.ruff.lint]
select = [
  "A", "ANN", "B", "C4", "DTZ", "E", "EXE", "F", "FA", "I", "ICN", "ISC", "LOG", "N",
  "PIE", "PLE", "PLW", "PT", "PYI", "Q", "RET", "RSE", "RUF", "SIM", "SLF", "SLOT", "TCH",
  "TID", "UP", "W", "YTT",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
suppress-none-returning = false

[tool.ruff.lint.isort]
known-first-party = ["mailroom"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection uses `Depends(...)` in parameter defaults by design.
"tests/**/*.py" = ["ANN", "E501", "S101"]
"mailroom/api/routes/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["mailroom"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_concatenate = true
extra_checks = true
show_error_codes = true
pretty = true
error_summary = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: PostgreSQL required (TEST_DATABASE_URL: local `compose.yml` postgres service via `mise run dev-db`, or the CI database step); loopback URL ends with _test unless MAILROOM_INTEGRATION_TESTS_ALLOW_ANY_DATABASE=1; mise run test-backend uses pytest-xdist (-n auto)",
]
