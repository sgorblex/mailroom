# The test Dovecot's overrides (scripts/test-mail.sh; copied from mailroom-mcp's
# test/dovecot/99-test.conf). Production is Mailu's Dovecot 2.3: no IMAP4rev2, and these four
# special-use folders exist from the start.
imap4rev2_enable = no
namespace inbox {
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}
